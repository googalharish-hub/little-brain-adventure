<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Brain Adventure V9</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(#7bdff2,#b8f2e6);color:#243447}.app{max-width:520px;margin:auto;min-height:100vh;padding:16px}.card{background:#fff;border-radius:28px;padding:20px;box-shadow:0 8px 25px #0002}.home{text-align:center}.lion{font-size:70px}h1{text-align:center;color:#ff8a00;font-size:28px}button{border:0;border-radius:18px;padding:14px 18px;font-size:18px;font-weight:700}.primary{background:#52c84b;color:white}.blue{background:#3ca8df;color:white}.gray{background:#eee}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center}.pill{background:#fff4b8;border-radius:18px;padding:8px 12px;font-weight:700}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.level{padding:12px 2px;background:#eaf7ff}.locked{opacity:.4}.game{text-align:center}.question{font-size:22px;font-weight:700;margin:18px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{background:#fff4d6;border:3px solid #ffd36a;min-height:70px}.feedback{min-height:32px;font-weight:700;margin:12px}.progress{height:12px;background:#eee;border-radius:10px;overflow:hidden}.bar{height:100%;background:#52c84b;width:0}
</style></head><body><div class="app">
<div id="home" class="card home"><div class="lion">🦁</div><h1>LITTLE BRAIN ADVENTURE</h1><p>PLAY • LEARN • GROW</p><p><b>V9 • 30 brain-building levels</b></p><button class="primary" onclick="showLevels()">▶ PLAY</button><div class="row" style="margin-top:12px"><button class="blue" onclick="showProgress()">📊 Progress</button><button class="gray" onclick="showLevels()">🗺️ Map</button></div></div>
<div id="levels" class="card hidden"><div class="top"><button class="gray" onclick="goHome()">← Home</button><div class="pill">⭐ <span id="stars">0</span></div></div><h2>🗺️ Adventure Map</h2><p style="text-align:center">Solve a level to unlock the next!</p><div class="levels" id="levelGrid"></div></div>
<div id="game" class="card game hidden"><div class="top"><button class="gray" onclick="showLevels()">← Map</button><div class="pill">⭐ <span id="gameStars">0</span></div></div><h2 id="levelTitle"></h2><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div></div>
<div id="progress" class="card hidden"><button class="gray" onclick="goHome()">← Home</button><h2>📊 My Progress</h2><p style="text-align:center;font-size:22px">⭐ Stars: <b id="pStars">0</b></p><p style="text-align:center;font-size:22px">🔓 Unlocked: <b id="pLevel">1</b>/30</p></div>
</div>
<script>
const KEY="lba_v9";let data=JSON.parse(localStorage.getItem(KEY)||'{"unlocked":1,"stars":0}'),current=1;
const puzzles=[
["Which number comes next? 1, 2, 3, ?",["4","5","6","2"],"4"],
["Which animal says MEOW?",["🐶 Dog","🐱 Cat","🐮 Cow","🦁 Lion"],"🐱 Cat"],
["Find the matching shape: 🔴",["🔵","🟩","🔴","⭐"],"🔴"],
["Which one is the biggest?",["🍎","🍉","🍓","🍒"],"🍉"]];
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function hideAll(){["home","levels","game","progress"].forEach(x=>document.getElementById(x).classList.add("hidden"))}
function goHome(){hideAll();home.classList.remove("hidden")}
function showLevels(){hideAll();levels.classList.remove("hidden");renderLevels()}
function showProgress(){hideAll();progress.classList.remove("hidden");pStars.textContent=data.stars;pLevel.textContent=data.unlocked}
function renderLevels(){stars.textContent=data.stars;levelGrid.innerHTML="";for(let i=1;i<=30;i++){let b=document.createElement("button");b.className="level"+(i>data.unlocked?" locked":"");b.textContent=i<=data.unlocked?"⭐ "+i:"🔒 "+i;b.onclick=()=>i<=data.unlocked&&startLevel(i);levelGrid.appendChild(b)}}
function startLevel(n){current=n;hideAll();game.classList.remove("hidden");levelTitle.textContent="Level "+n;gameStars.textContent=data.stars;bar.style.width=((n-1)/30*100)+"%";feedback.textContent="";let p=puzzles[(n-1)%puzzles.length];question.textContent=p[0];options.innerHTML="";p[1].forEach(x=>{let b=document.createElement("button");b.className="opt";b.textContent=x;b.onclick=()=>answer(x,p[2]);options.appendChild(b)})}
function answer(x,a){if(x===a){data.stars++;if(current===data.unlocked&&data.unlocked<30)data.unlocked++;save();feedback.textContent="🎉 Great job! +1 ⭐";gameStars.textContent=data.stars;setTimeout(()=>current<30?startLevel(current+1):showLevels(),900)}else{feedback.textContent="💡 Try again!";setTimeout(()=>feedback.textContent="",700)}}
goHome();
</script></body></html>
